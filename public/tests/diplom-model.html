<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diploma model test</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js"
        }
      }
    </script>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      html, body { margin: 0; min-height: 100%; background: rgba(0, 0, 0, 0); }
      body { overflow: hidden; }
      #viewer { width: 100vw; height: 100vh; }
      .hud { position: fixed; inset: 24px auto auto 24px; z-index: 2; max-width: 22rem; color: #20231f; pointer-events: none; }
      h1 { margin: 0 0 0.5rem; font-size: 1rem; font-weight: 500; letter-spacing: 0.02em; }
      p { margin: 0; color: #62665e; font-size: 0.8rem; line-height: 1.45; }
      #status { position: fixed; inset: 50% auto auto 50%; transform: translate(-50%, -50%); color: #62665e; font-size: 0.85rem; }
      .error { color: #a33d2f !important; }
    </style>
  </head>
  <body>
    <div id="viewer" aria-label="Interactive 3D test of the diploma model"></div>
    <div class="hud">
      <h1>Diploma model — test</h1>
      <p>Drag to rotate · scroll to zoom · shift-drag to pan</p>
    </div>
    <div id="status">Loading model…</div>
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js';
      import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/controls/OrbitControls.js';
      import { DRACOLoader } from 'https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/DRACOLoader.js';
      import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/GLTFLoader.js';

      const viewer = document.querySelector('#viewer');
      const status = document.querySelector('#status');
      const scene = new THREE.Scene();
      scene.background = null;

      const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 10000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      renderer.setClearAlpha(0);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.domElement.style.background = 'transparent';
      viewer.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xf5efe4, 0x302b25, 2.4));
      const key = new THREE.DirectionalLight(0xffffff, 3.5);
      key.position.set(4, 8, 6);
      scene.add(key);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.screenSpacePanning = true;

      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/libs/draco/');
      loader.setDRACOLoader(dracoLoader);

      loader.load(
        './diplom-modell-test.glb',
        (gltf) => {
          const model = gltf.scene;
          scene.add(model);
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const radius = Math.max(size.x, size.y, size.z) * 0.5;
          model.position.sub(center);
          camera.position.set(radius * 1.8, radius * 1.1, radius * 1.8);
          camera.near = Math.max(radius / 1000, 0.001);
          camera.far = Math.max(radius * 20, 100);
          camera.updateProjectionMatrix();
          controls.target.set(0, 0, 0);
          controls.maxDistance = radius * 8;
          controls.minDistance = Math.max(radius * 0.2, 0.05);
          controls.update();
          status.remove();
        },
        (event) => {
          if (event.total) status.textContent = `Loading model… ${Math.round((event.loaded / event.total) * 100)}%`;
        },
        (error) => {
          status.textContent = 'Could not load the model.';
          status.classList.add('error');
          console.error(error);
        },
      );

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
